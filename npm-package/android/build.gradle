apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'maven-publish'
apply plugin: 'expo-module-gradle-plugin'

// Bump in lockstep with npm-package/package.json on each release.
// Kept as a literal (not parsed from package.json) so Android Studio's
// Gradle diagnostics don't choke on `groovy.json.JsonSlurper` resolution.
def package_version = '0.2.12'

group = 'expo.modules.walletcore'
version = package_version

android {
    namespace 'expo.modules.walletcore'
    compileSdk 35

    defaultConfig {
        minSdkVersion 23
        targetSdkVersion 35
        versionCode 1
        versionName package_version
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main {
            java {
                srcDirs += ['src/main/java']
            }
        }
    }

    // Required by AGP 8+ before publishing.publications can reference
    // components.release. expo-module-gradle-plugin asks for the 'release'
    // SoftwareComponent during configure; without singleVariant the component
    // doesn't exist and the configure phase fails.
    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }
}

// Materialise the publishing.publications.release entry AFTER android's
// release variant has been finalised (the SoftwareComponent is added late
// in evaluation). Without this, expo-module-gradle-plugin's internal hooks
// still throw 'SoftwareComponent with name release not found' during
// configure even when singleVariant is declared above.
afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = group
                artifactId = 'wallet-core'
                version = package_version
            }
        }
    }
}

// projectDir = node_modules/@kyehyukahn/wallet-core/android/
// Native artifacts are downloaded by postinstall to ../native/android/.
def nativeAndroidDir = new File(projectDir.parentFile, 'native/android')

dependencies {
    implementation files("${nativeAndroidDir}/wallet-core.aar")
    implementation files("${nativeAndroidDir}/wallet-core-proto.jar")
    // Required at runtime by wallet-core-proto.jar (it uses
    // 'api com.google.protobuf:protobuf-javalite:3.22.3' so this is
    // transitive, but we list it explicitly for clarity + Gradle conflict
    // resolution).
    implementation 'com.google.protobuf:protobuf-javalite:3.22.3'
}

// Some consumer apps pull a different protobuf-java/javalite version via
// other dependencies. Force our version to avoid duplicate class errors at
// dex / R8 time.
configurations.all {
    resolutionStrategy {
        force 'com.google.protobuf:protobuf-javalite:3.22.3'
    }
}
