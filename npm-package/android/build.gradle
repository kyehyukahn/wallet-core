apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'expo-module-gradle-plugin'

// Bump in lockstep with npm-package/package.json on each release.
// Kept as a literal (not parsed from package.json) so Android Studio's
// Gradle diagnostics don't choke on `groovy.json.JsonSlurper` resolution.
def package_version = '0.2.18'

group = 'expo.modules.walletcore'
version = package_version

// projectDir = node_modules/@kyehyukahn/wallet-core/android/
// Native artifacts are downloaded by postinstall to ../native/android/.
//
// MUST be declared BEFORE the `android { ... }` block. AGP evaluates that
// closure eagerly during the configuration phase, and
// `sourceSets.main.jniLibs.srcDirs += ["${nativeAndroidDir}/jniLibs"]` reads
// the variable from script-scope at that moment. v0.2.17 placed this `def`
// after the `android { ... }` block (the v0.2.16 location, which worked
// because back then only the lazily-evaluated `dependencies { ... }` block
// referenced `${nativeAndroidDir}`) and that broke fresh consumer installs
// with `MissingPropertyException: nativeAndroidDir` → cascade
// `SoftwareComponent with name 'release' not found` from
// expo-module-gradle-plugin's `applyPublishing`. Convention going forward:
// every `def` lives above the `android { ... }` block. release-pack guard
// #13 enforces it for this specific name.
def nativeAndroidDir = new File(projectDir.parentFile, 'native/android')

android {
    namespace 'expo.modules.walletcore'
    compileSdk 35

    defaultConfig {
        minSdkVersion 23
        targetSdkVersion 35
        versionCode 1
        versionName package_version
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main {
            java {
                srcDirs += ['src/main/java']
            }
            // v0.2.17+: wallet-core's native .so libs land here after
            // postinstall unpacks wallet-core.aar. AGP merges them into the
            // consumer APK exactly as the old AAR dep used to — but without
            // tripping `hasLocalAarDeps` on AGP 8.x's bundleDebugAar.
            jniLibs.srcDirs += ["${nativeAndroidDir}/jniLibs"]
        }
    }

    // NB: do not declare `publishing.singleVariant("release")` here —
    // expo-module-gradle-plugin already does so on our behalf, and a second
    // call fails with "Using singleVariant publishing DSL multiple times".
    // Same applies to `apply plugin: 'maven-publish'` and any explicit
    // `publishing.publications.release(MavenPublication)` block.
}

dependencies {
    // v0.2.17+: consume classes from the unpacked classes.jar (renamed to
    // wallet-core-classes.jar by postinstall) instead of the wallet-core.aar
    // container. AGP 8.x's hasLocalAarDeps check refuses a local-AAR file dep
    // on an android-library module (`:kyehyukahn-wallet-core:bundleDebugAar`),
    // and the original AAR has no res/aidl/components — only classes.jar +
    // jniLibs — so the container provides no value here. jniLibs.srcDirs
    // above picks up the .so set; net APK contents are unchanged.
    implementation files("${nativeAndroidDir}/wallet-core-classes.jar")
    implementation files("${nativeAndroidDir}/wallet-core-proto.jar")
    // Required at runtime by wallet-core-proto.jar (it uses
    // 'api com.google.protobuf:protobuf-javalite:3.22.3' so this is
    // transitive, but we list it explicitly for clarity + Gradle conflict
    // resolution).
    implementation 'com.google.protobuf:protobuf-javalite:3.22.3'
}

// Some consumer apps pull a different protobuf-java/javalite version via
// other dependencies. Force our version to avoid duplicate class errors at
// dex / R8 time.
configurations.all {
    resolutionStrategy {
        force 'com.google.protobuf:protobuf-javalite:3.22.3'
    }
}
